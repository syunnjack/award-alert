name: Probe ranking
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Referer に使うドメイン（楽天のアプリで許可済みのもの）'
        type: string
        default: 'https://gravure-meikan.jp'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - env:
          RAKUTEN_ICHIBA_APP_ID: ${{ secrets.RAKUTEN_ICHIBA_APP_ID }}
          RAKUTEN_ICHIBA_ACCESS_KEY: ${{ secrets.RAKUTEN_ICHIBA_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          SITE_URL: ${{ inputs.site || 'https://gravure-meikan.jp' }}
          PYTHONIOENCODING: utf-8
        run: python scripts/probe_ranking.py
